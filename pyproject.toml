[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "civmarshmallow"
dynamic = ["version"]
description = "Replay-grounded reward signals for long-horizon Freeciv agents: CivHarness, CivTelescope, and CivMarshmallow"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# civharness itself is stdlib-only; it drives a pinned freeciv-server 3.2.5
# binary (scripts/install_freeciv_server.sh, located via CIVHARNESS_SERVER).
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
# CivTelescope training and evaluation, value head.
civtelescope = ["torch", "transformers"]
# Cross-game trap banks (chess additionally needs a Stockfish binary in STOCKFISH_BIN).
games = ["chess", "open_spiel", "catanatron"]

[dependency-groups]
# Installed by `uv sync`; with pip (>= 25.1): `pip install --group dev`.
dev = ["pytest", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "civmarsh.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["civmarsh*", "civharness*"]

[tool.setuptools.package-data]
civharness = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
